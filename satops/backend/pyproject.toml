[project]
name = "satops-backend"
version = "0.1.0"
description = "SatOps Dashboard - Satellite Communications Ground Segment Backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "aiosqlite>=0.21",
    "pydantic-settings>=2.7",
    "skyfield>=1.49",
    "numpy>=2.0",
    "scipy>=1.14",
    "httpx>=0.28",
    "websockets>=14.0",
]

# SoapySDR is installed via system package manager (brew install soapysdr)
# not from PyPI — it will be available if installed on the system

[tool.ruff]
line-length = 119
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
    "pytest>=8.0",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
]
